server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: any path with no matching file falls back to index.html, so
    # client-side routing (useRouter) owns the URL instead of nginx 404ing it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same rule this whole app is built around: relative /api in every
    # environment. Compose puts both containers on one network where `api`
    # resolves by service name — no host to configure here either.
    location /api/ {
        # Where the API is: `api:41700` (the compose service) by default, or
        # `unix:/run/gaca/api.sock` when the API runs on the host. Filled in at container
        # start from GACA_API_UPSTREAM (nginx image's envsubst templates).
        proxy_pass http://${GACA_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (GET /api/sessions/{id}/events) is a long-lived response nginx
        # would otherwise buffer — it'd hold the whole thing until the
        # connection closes instead of forwarding each event as it arrives,
        # which defeats the point of a live stream. Off for this whole
        # location; the cost (proxying ordinary JSON responses unbuffered
        # too) is negligible at this traffic scale.
        proxy_buffering off;
        proxy_cache off;
        # Alerts are read by polling, not a stream (build-plan.md slice 6 —
        # cut), but the session-events endpoint above still needs headroom
        # for a run that's mid-delegation and taking a while to answer.
        proxy_read_timeout 300s;
        # Photo attachments (POST /api/sessions/{id}/attachments). nginx's default
        # is 1m, which would 413 an ordinary phone photo. Matches the outer
        # gateway's 2m; the API enforces the same cap, and the app downscales first.
        client_max_body_size 2m;
    }

    # Cache static assets — Vite fingerprints these filenames on every build,
    # so a new deploy gets new URLs and a long cache here is always safe.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
