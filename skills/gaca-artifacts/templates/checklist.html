<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checklist</title>
<style>
  /* Look comes from the app's stylesheet: plain elements, .row, .grow, .sub, .muted, .done, .empty, h2.
     Nothing to style here except what is unique to this page. */
  form { display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--text); }
  form input { border: 0; }
  .bar { display: flex; gap: 20px; margin-top: 16px; }
</style>
</head>
<body>
<!-- No title or intro: the app already shows the title. The page opens on its content. -->
<form id="add"><input id="text" type="text" placeholder="Add item" aria-label="Add item" autocomplete="off" enterkeyhint="done"><button>Add</button></form>
<div id="list"></div>
<div class="bar"><button id="clear">Clear checked</button><button id="ask">Ask Hermes</button></div>

<script>
  // The page is only a view. Items live in the API (collection "items"), so they survive
  // closing the page, and the agent can add to the same list while the page is closed.
  var items = app.collection('items');

  function render(snap) {
    var docs = snap.docs('items');                       // [{id, text, done, category?, quantity?}]
    var host = document.getElementById('list');
    if (!docs.length) { host.innerHTML = '<div class="empty">Nothing here yet.</div>'; return; }
    var open = docs.filter(function (d) { return !d.done; });
    var done = docs.filter(function (d) { return d.done; });
    var html = '';
    // Groups are optional: a section label appears only when items actually have a category.
    var cats = {};
    open.forEach(function (d) { (cats[d.category || ''] = cats[d.category || ''] || []).push(d); });
    Object.keys(cats).sort().forEach(function (cat) {
      html += (cat ? '<h2>' + esc(cat) + '</h2>' : '') + cats[cat].map(row).join('');
    });
    if (done.length) html += '<h2>Done · ' + done.length + '</h2>' + done.map(row).join('');
    host.innerHTML = html;
  }
  function row(d) {
    return '<div class="row" data-id="' + esc(d.id) + '">' +
      '<input type="checkbox"' + (d.done ? ' checked' : '') + ' aria-label="' + esc(d.text) + '">' +
      '<span class="grow' + (d.done ? ' done' : '') + '">' + esc(d.text) + '</span>' +
      (d.quantity ? '<span class="muted num">' + esc(d.quantity) + '</span>' : '') +
      '<button class="faint" aria-label="Remove">×</button></div>';
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }

  document.getElementById('list').addEventListener('click', function (e) {
    var r = e.target.closest('.row'); if (!r) return;
    var id = r.dataset.id;
    if (e.target.closest('button')) items.remove(id);
    else if (e.target.matches('input[type=checkbox]')) items.patch(id, { done: e.target.checked });
    else items.patch(id, { done: !r.querySelector('input').checked });   // the whole row is the tap target
  });
  document.getElementById('add').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('text'), text = input.value.trim();
    if (!text) return;
    input.value = '';
    items.add({ text: text, done: false });
  });
  document.getElementById('clear').addEventListener('click', function () {
    app.load().then(function (snap) {
      var ops = snap.docs('items').filter(function (d) { return d.done; })
        .map(function (d) { return { op: 'delete', collection: 'items', id: d.id }; });
      if (ops.length) app.batch(ops);
    });
  });
  document.getElementById('ask').addEventListener('click', function () { app.ask('About the ' + app.artifact.title + ' list: '); });

  app.subscribe(render);   // renders now, and again whenever the data changes (including agent edits)
</script>
</body>
</html>
