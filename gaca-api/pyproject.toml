[project]
name = "gaca-api"
version = "0.1.0"
description = "GACA API — the front door and system of record"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "sse-starlette>=2.1",
    # The http2 extra (h2) is for APNs, which only speaks HTTP/2 (services/apns.py).
    "httpx[http2]>=0.27",
    # Auth. PyJWT mints/validates the bearer tokens; argon2-cffi hashes
    # passwords; email-validator is what pydantic's EmailStr needs at runtime.
    # The crypto extra adds ES256, which APNs provider tokens are signed with.
    "pyjwt[crypto]>=2.8",
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
    # Verifies the signature and audience of Google ID tokens server-side.
    "google-auth[requests]>=2.29.0",
    # Sends push notifications via Firebase Cloud Messaging (services/push.py).
    "firebase-admin>=6.5",
    "asyncssh>=2.24.0",
]

# Console entry point. `gaca-api` on PATH starts the server via main:run().
# uv installs this into .venv/bin; Nix installs it into the packaged venv, and
# that same binary is what a systemd ExecStart will point at on the Pi.
[project.scripts]
gaca-api = "gaca_api.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# We now DO declare a build-system. Packaging the app with Nix (uv2nix) needs a
# real, installable artifact — a wheel — not just a "virtual" project whose code
# is imported from the source dir. hatchling is the build backend that produces
# that wheel; it's a *build-time* dependency only, not shipped at runtime.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tell hatchling exactly which package directory to put in the wheel. (It would
# usually infer gaca_api/ from the project name, but being explicit is clearer
# and avoids surprises if we add more top-level modules later.)
[tool.hatch.build.targets.wheel]
packages = ["gaca_api"]
