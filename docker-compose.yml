# `docker compose up --build` runs the full stack: gaca-api + the built React
# SPA behind nginx, on the same network so the frontend's /api/ proxy can
# reach `api` by service name (see frontend/nginx.conf).
#
# Variable substitution (the ${...} below) reads from a `.env` file in this
# directory, or the shell environment, in that order — this is Compose's own
# convention, not something wired up here. The repo root already has a `.env`
# (gitignored) for the Nix/Hermes flake; set the GACA_-prefixed vars in that
# same file for Docker too, or override per-shell. Anything left unset falls
# back to the `:-default` after each var, which is fine for a throwaway local
# run but NOT for anything that stays up — GACA_JWT_SECRET in particular.
services:
  api:
    build:
      context: .
      target: backend
    container_name: gaca-api
    ports:
      - "41700:41700"
    # Lets a user's agent_base_url say host.docker.internal:8642 to reach
    # Hermes running on the dev box's own host — same trick
    # scripts/dev.sh's HERMES_BASE relies on outside Docker. Each user submits
    # their own agent URL via PUT /api/auth/agent-config (see
    # gaca-planning/alerts/build-plan.md), not an env var, so this is just
    # making that hostname resolvable, not configuring anything itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # SQLite lives on a host directory, not the container's writable layer —
    # without this the whole database vanishes on the next `up --build`
    # (gaca-planning/alerts/build-plan.md, slice 7). A bind mount rather than
    # a named Docker volume on purpose: the app's own philosophy is "one file,
    # backups are a file copy" (build-plan.md §5), and a named volume buries
    # that file under /var/lib/docker/volumes/... where you'd need root to get
    # at it. Set GACA_DATA_DIR in the root .env to an absolute path you own —
    # falls back to a project-relative ./data (gitignored) if unset.
    volumes:
      - ${GACA_DATA_DIR:-./data}:/var/lib/gaca
    environment:
      - GACA_JWT_SECRET=${GACA_JWT_SECRET:-change-me-in-production}
      - GACA_JWT_ALGORITHM=${GACA_JWT_ALGORITHM:-HS256}
      - GACA_JWT_EXPIRE_MINUTES=${GACA_JWT_EXPIRE_MINUTES:-10080}
      - GACA_GOOGLE_CLIENT_ID=${GACA_GOOGLE_CLIENT_ID:-}
      # 0.0.0.0, not the loopback-only default that's correct for bare-metal
      # dev — other containers (and, on the Pi, nginx) reach this one over
      # the compose network, not localhost.
      - GACA_API_HOST=0.0.0.0
      - GACA_API_PORT=41700
      - GACA_DB_PATH=/var/lib/gaca/gaca.db
      - GACA_AGENT_ENGINE=${GACA_AGENT_ENGINE:-hermes}
      - GACA_AGENT_STREAM_IDLE_TIMEOUT=${GACA_AGENT_STREAM_IDLE_TIMEOUT:-30}
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
      args:
        # Baked into the JS bundle at build time (Vite), not read at
        # container start — see the Dockerfile's frontend-build stage.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: gaca-frontend
    ports:
      - "41800:80"
    depends_on:
      - api
    restart: unless-stopped
