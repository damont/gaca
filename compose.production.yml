# Production compose — deployed on the Hermes box (david-claw), run alongside the standalone
# `gateway` stack (nginx + cloudflared) that lives outside this repo at ~/gateway/.
#
# The API is NOT a container here: it runs as a host process (deploy/gaca-api.service, with
# GACA_AGENT_ACCESS=local) so it can run the host's `hermes` CLI and read Hermes' files. This
# file only runs the web frontend, whose nginx proxies /api to the API's Unix socket through a
# mounted directory (GACA_SOCKET_DIR) — nothing is published to a host port and no firewall rule
# is needed.
#
# Differs from docker-compose.yml (local dev, API in a container) in the ways that matter for
# a box actually reachable from the internet:
#   - nothing published to a host port — the gateway's nginx reaches the frontend over the
#     shared gaca-proxy network
#   - required values use ${VAR:?message} — fail loudly at `up` instead of booting with a default
#   - init: true, no-new-privileges, capped JSON logging, healthcheck
name: gaca

services:
  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    environment:
      GACA_API_UPSTREAM: unix:/run/gaca/api.sock
    volumes:
      - ${GACA_SOCKET_DIR:?GACA_SOCKET_DIR must be set to the directory holding the API socket — see deploy/gaca-api.service}:/run/gaca
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      gaca-proxy:
        aliases:
          - gaca-frontend


networks:
  gaca-proxy:
    external: true
